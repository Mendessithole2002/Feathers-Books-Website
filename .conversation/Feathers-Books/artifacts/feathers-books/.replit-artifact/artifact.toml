kind = "mobile"
previewPath = "/feathers-books/"
title = "Feathers Books"
description = "A reading and publishing app where readers can browse a curated library, read books, and authorized publishers can add and manage titles with covers and PDF manuscripts."
version = "1.0.0"
id = "artifacts/feathers-books"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/feathers-books/" ]
localPort = 18199

[services.development]
run = "pnpm --filter @workspace/feathers-books run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/feathers-books", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/feathers-books", "run", "serve" ]

[services.env]
PORT = "18199"
BASE_PATH = "/feathers-books/"
